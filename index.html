<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仕事から逃げろ！</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="ui-bar">
            <span>Lives: <span id="lives">❤️❤️❤️</span></span>
            <span>Score: <span id="score">0</span></span>
        </div>
        <canvas id="game-canvas"></canvas>
        <div id="game-over-screen" class="hidden">
            <h2>Game Over</h2>
            <p>Your Score: <span id="final-score">0</span></p>
            <div id="ranking-form">
                <input type="text" id="player-name" placeholder="Enter your name (e.g., John Doe)" maxlength="30">
                <button id="save-score-button">Save Score</button>
            </div>
            <button id="restart-button" class="hidden">Restart</button>
            <h3>Ranking</h3>
            <ul id="ranking-list"></ul>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
